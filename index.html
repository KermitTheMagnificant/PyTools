<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
  <style>
    body { font-family: sans-serif; margin: 0; background: #111; color: #eee; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #1b1b1b; }
    header h1 { font-size: 1.2rem; margin: 0; flex: 1; }
    input, select { padding: 6px 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; }
    #player-area { padding: 16px; }
    video { width: 100%; max-height: 60vh; background: #000; }
    #error { color: #ff7b7b; min-height: 1.2em; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 16px 16px; }
    .card { background: #1b1b1b; border-radius: 8px; padding: 10px; cursor: pointer; text-align: center; }
    .card:hover { background: #262626; }
    .card img { max-width: 100%; height: 50px; object-fit: contain; }
    .card .name { font-size: 0.85rem; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Live TV</h1>
    <input id="search" placeholder="Search channels">
    <select id="category"><option value="">All categories</option></select>
  </header>

  <section id="player-area">
    <video id="video" controls autoplay></video>
    <p id="now-playing">Pick a channel below</p>
    <p id="error"></p>
  </section>

  <section id="grid"></section>

  <script>
    const video = document.getElementById("video");
    const nowPlaying = document.getElementById("now-playing");
    const errorEl = document.getElementById("error");
    const grid = document.getElementById("grid");
    const searchBox = document.getElementById("search");
    const categorySelect = document.getElementById("category");

    let hls = null;
    let searchTimer = null;

    function play(channel) {
      nowPlaying.textContent = channel.name;
      errorEl.textContent = "";

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            errorEl.textContent = "This stream couldn't be played in the browser.";
            hls.destroy();
            hls = null;
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = channel.url;
      } else {
        errorEl.textContent = "This browser can't play HLS streams.";
      }
    }

    async function loadChannels() {
      const params = new URLSearchParams({
        category: categorySelect.value,
        search: searchBox.value,
      });
      const response = await fetch("/api/channels?" + params);
      const channels = await response.json();

      grid.replaceChildren();
      for (const channel of channels) {
        const card = document.createElement("div");
        card.className = "card";

        if (channel.logo) {
          const img = document.createElement("img");
          img.src = channel.logo;
          img.alt = "";
          img.onerror = () => img.remove();
          card.appendChild(img);
        }

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = channel.name;
        card.appendChild(name);

        card.onclick = () => play(channel);
        grid.appendChild(card);
      }
    }

    async function loadCategories() {
      const response = await fetch("/api/categories");
      const categories = await response.json();
      for (const category of categories) {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categorySelect.appendChild(option);
      }
    }

    categorySelect.onchange = loadChannels;
    searchBox.oninput = () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadChannels, 250);
    };

    loadCategories();
    loadChannels();
  </script>
</body>
</html>
